name: Batch Update QX Rules

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨自动同步
  workflow_dispatch:      # 支持手动点击运行

permissions:
  contents: write         # 允许写入仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python scripts/convert.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 使用 -A 确保添加所有新创建的子目录和文件
          git add "Quantumult X/*"
          
          git commit -m "Update rules by category: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
